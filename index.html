<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HỆ THỐNG QUẢN LÝ HSD – Saigon Co.op</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{background:#f3f4f6}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.brand-bg{background:#c40018}
.brand-text{color:#c40018}
.hidden { display: none; }

/* ===== BLINK ===== */
.blink30{animation:blink30 .6s linear infinite;border:2px solid #fb923c}
@keyframes blink30{0%{background:#fff3e0}50%{background:#ff9800}100%{background:#fff3e0}}
.blink20{animation:blink20 .6s linear infinite;border:2px solid #ef4444}
@keyframes blink20{0%{background:#fff1f2}50%{background:#fecaca}100%{background:#fff1f2}}


/* ===== POPUP ===== */
#alertPopup{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000}
.popup-30{border:3px solid #fb923c}
.popup-20{border:3px solid #ef4444}

/* ===== SCAN ===== */
#reader,#printReader{position:relative;width:100%;height:260px;background:#000}
.scan-frame{position:absolute;inset:10%;border:2px solid rgba(255,255,255,.4)}
.scan-line{position:absolute;left:5%;width:90%;height:4px;background:red;animation:scanMove 1.2s linear infinite}
@keyframes scanMove{0%{top:30%}50%{top:50%}100%{top:70%}}
</style>
</head>

<body class="max-w-xl mx-auto p-3">

<!-- POPUP -->
<div id="alertPopup" class="hidden items-center justify-center">
  <div id="popupBox" class="bg-white p-5 rounded-xl w-[90%] max-w-sm text-center">
    <div id="popupTitle" class="font-bold text-lg mb-2"></div>
    <div id="popupMsg" class="mb-4"></div>
    <button onclick="closePopup()" class="brand-bg text-white px-4 py-2 rounded">Đã hiểu</button>
  </div>
</div>

<!-- HEADER -->
<div class="flex justify-between items-center mb-4 p-3 rounded-lg brand-bg text-white">
  <div class="font-bold text-lg">HỆ THỐNG QUẢN LÝ HSD</div>
</div>

<div class="card p-4 space-y-3">

<label class="font-semibold">Barcode sản phẩm</label>
<input id="barcode" class="border p-2 rounded w-full">

<label class="font-semibold">Hình thức nhập ngày</label>
<select id="mode" class="border p-2 rounded w-full" onchange="toggleMode()">
  <option value="full">Có NSX & HSD</option>
  <option value="hsd-only">Chỉ có HSD</option>
</select>

<div id="nsxBox">
  <label class="font-semibold">Ngày sản xuất (NSX)</label>
  <input type="date" id="nsx" class="border p-2 rounded w-full">
</div>

<div id="offsetBox" class="hidden">
  <label class="font-semibold">NSX trước HSD (số ngày)</label>
  <input type="number" id="offsetDays" class="border p-2 rounded w-full" placeholder="Ví dụ: 180">
</div>

<label class="font-semibold">Hạn sử dụng (HSD)</label>
<input type="date" id="hsd" class="border p-2 rounded w-full">

<div class="grid grid-cols-2 gap-2 pt-2">
  <button onclick="calculate()" class="brand-bg text-white py-2 rounded">TÍNH KẾT QUẢ</button>
  <button onclick="resetForm()" class="bg-gray-500 text-white py-2 rounded">TÍNH LẠI</button>
</div>

<div id="result"></div>
</div>

<script>
function resetForm(){
  barcode.value="";
  nsx.value="";
  hsd.value="";
  result.innerHTML="";
}

function toggleMode(){
  const m=mode.value;
  nsxBox.classList.toggle("hidden",m==="hsd-only");
  offsetBox.classList.toggle("hidden",m!=="hsd-only");
  if(m==="hsd-only") nsx.value="";
}

/* ===== CALCULATE GỐC – GIỮ NGUYÊN ===== */
function calculate(){
  const nsxVal=nsx.value,hsdVal=hsd.value;
  if(!nsxVal||!hsdVal){alert("Nhập đủ NSX & HSD");return}
  const nsxD=new Date(nsxVal),hsdD=new Date(hsdVal);
  if(hsdD<=nsxD){alert("HSD phải lớn hơn NSX");return}

  const total=(hsdD-nsxD)/86400000;
  const date30=new Date(nsxD.getTime()+total*0.7*86400000);
  const date20=new Date(nsxD.getTime()+total*0.8*86400000);
  const today=new Date();

  let warn30="",warn20="",b30="",b20="";
  if(today>=date30){warn30="Giải tồn";b30="blink30"}
  if(today>=date20){warn20="Rút hàng";b20="blink20"}

  result.innerHTML=`
    <div class="border p-3 mb-2 ${b30}">
      <b>MỐC 30%</b><br>${date30.toLocaleDateString("vi-VN")}<br>${warn30||"Bình thường"}
    </div>
    <div class="border p-3 ${b20}">
      <b>MỐC 20%</b><br>${date20.toLocaleDateString("vi-VN")}<br>${warn20||"Bình thường"}
    </div>`;

  if(today>=date20)showPopup("20");
  else if(today>=date30)showPopup("30");
}

/* ===== BỌC calculate – CHỈ BỔ SUNG NGHIỆP VỤ ===== */
const __calculate_origin=calculate;
calculate=function(){
  if(mode.value==="hsd-only"){
    const off=Number(offsetDays.value);
    if(!off||off<=0){alert("Nhập số ngày NSX trước HSD");return}
    if(!hsd.value){alert("Vui lòng nhập HSD");return}
    const d=new Date(hsd.value);
    d.setDate(d.getDate()-off);
    nsx.value=d.toISOString().split("T")[0];
  }
  __calculate_origin();
};

function showPopup(type){
  const popup=alertPopup,box=popupBox,title=popupTitle,msg=popupMsg;
  box.className="bg-white p-5 rounded-xl w-[90%] max-w-sm text-center";
  if(type==="30"){title.innerText="CẢNH BÁO 30%";msg.innerText="Báo cáo quản lý để giải tồn.";box.classList.add("popup-30")}
  if(type==="20"){title.innerText="CẢNH BÁO 20%";msg.innerText="Rút hàng khỏi quầy.";box.classList.add("popup-20")}
  popup.classList.remove("hidden");popup.classList.add("flex");
}
function closePopup(){alertPopup.classList.add("hidden");alertPopup.classList.remove("flex")}
  function toggleMode(){
  const m = document.getElementById("mode").value;
  document.getElementById("nsxBox").classList.toggle("hidden", m === "hsd-only");
  document.getElementById("offsetBox").classList.toggle("hidden", m !== "hsd-only");
  if(m === "hsd-only") document.getElementById("nsx").value = "";
}
const __calculate_origin = calculate;

calculate = function(){
  if(document.getElementById("mode").value === "hsd-only"){
    const off = Number(document.getElementById("offsetDays").value);
    if(!off || off <= 0){
      alert("Nhập số ngày NSX trước HSD");
      return;
    }
    const hsdVal = document.getElementById("hsd").value;
    if(!hsdVal){
      alert("Vui lòng nhập HSD");
      return;
    }
    const d = new Date(hsdVal);
    d.setDate(d.getDate() - off);
    document.getElementById("nsx").value = d.toISOString().split("T")[0];
  }
  __calculate_origin();
};

</script>

</body>
</html>
