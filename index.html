<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HỆ THỐNG QUẢN LÝ HSD – Saigon Co.op</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{background:#f3f4f6}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.brand-bg{background:#c40018}
.brand-text{color:#c40018}

.blink30{animation:blink30 .6s linear infinite;border:2px solid #fb923c}
@keyframes blink30{0%{background:#fff3e0}50%{background:#ff9800}100%{background:#fff3e0}}
.blink20{animation:blink20 .6s linear infinite;border:2px solid #ef4444}
@keyframes blink20{0%{background:#fff1f2}50%{background:#fecaca}100%{background:#fff1f2}}

#sidebar{position:fixed;top:0;left:0;width:260px;height:100%;background:#fff;
box-shadow:4px 0 16px rgba(0,0,0,.15);transform:translateX(-100%);
transition:.3s;z-index:1000}
#sidebar.active{transform:translateX(0)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:900}
#overlay.active{display:block}

.filter-btn{padding:6px 12px;border-radius:6px;border:1px solid #ddd;background:#f5f5f5;font-size:13px}
.filter-btn.active{background:#2563eb;color:white;border-color:#2563eb}

#reader,#printReader{width:100%;height:260px;background:#000}
.scan-frame{position:absolute;inset:10%;border:2px solid rgba(255,255,255,.4)}
.scan-line{position:absolute;left:5%;width:90%;height:4px;background:red;
animation:scanMove 1.2s linear infinite}
@keyframes scanMove{0%{top:30%}50%{top:50%}100%{top:70%}}
</style>
</head>

<body class="max-w-xl mx-auto p-3">

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="p-4 border-b text-center font-bold brand-text">Saigon Co.op</div>
  <div class="p-3 space-y-2">
    <button onclick="showMain()" class="w-full text-left px-3 py-2 rounded bg-red-50">📦 Quản lý HSD</button>
    <button onclick="showPrint()" class="w-full text-left px-3 py-2 rounded bg-slate-100">🖨 In bảng giá quầy</button>
  </div>
</div>
<div id="overlay" onclick="toggleMenu()"></div>

<!-- HEADER -->
<div class="flex justify-between items-center mb-4 p-3 rounded-lg brand-bg text-white">
  <div class="font-bold text-lg">HỆ THỐNG QUẢN LÝ HSD</div>
  <button onclick="toggleMenu()" class="text-2xl">☰</button>
</div>

<!-- ================= MAIN APP ================= -->
<div id="mainApp">

<div class="card p-4 space-y-3">

<label class="font-semibold">Barcode sản phẩm</label>
<div class="flex gap-2">
  <input id="barcode" class="border p-2 rounded w-full">
  <button onclick="startScan()" class="brand-bg text-white px-3 rounded">Quét</button>
</div>
<div id="reader" class="hidden"></div>

<label class="font-semibold">Hình thức nhập ngày</label>
<select id="mode" class="border p-2 rounded w-full" onchange="toggleMode()">
  <option value="full">Có NSX & HSD</option>
  <option value="hsd-only">Chỉ có HSD (NSX = HSD - số ngày)</option>
</select>

<label class="font-semibold">Ngày sản xuất (NSX)</label>
<input type="date" id="nsx" class="border p-2 rounded w-full">

<div id="offsetBox" class="hidden">
  <label class="font-semibold">NSX trước HSD (số ngày)</label>
  <input type="number" id="offsetDays" class="border p-2 rounded w-full" placeholder="Ví dụ: 180">
</div>

<label class="font-semibold">Hạn sử dụng (HSD)</label>
<input type="date" id="hsd" class="border p-2 rounded w-full">

<div class="grid grid-cols-2 gap-2">
  <button onclick="calculate()" class="brand-bg text-white py-2 rounded">TÍNH KẾT QUẢ</button>
  <button onclick="resetForm()" class="bg-gray-500 text-white py-2 rounded">TÍNH LẠI</button>
</div>

<div id="result"></div>

<div class="grid grid-cols-2 gap-2 pt-2">
  <button onclick="exportExcel()" class="bg-slate-700 text-white py-2 rounded">Xuất Excel</button>
  <button onclick="clearHistory()" class="bg-red-600 text-white py-2 rounded">Xóa lịch sử</button>
</div>

<div id="statistic" class="text-sm pt-2"></div>
</div>

<div class="card p-3 mt-4">
<h2 class="font-bold brand-text mb-2">Lịch sử tính toán</h2>

<div class="flex gap-2 mb-2">
  <button onclick="setFilter('all')" id="f-all" class="filter-btn active">Tất cả</button>
  <button onclick="setFilter('30')" id="f-30" class="filter-btn">Giải tồn (30%)</button>
  <button onclick="setFilter('20')" id="f-20" class="filter-btn">Rút hàng (20%)</button>
</div>

<div id="history" class="text-sm space-y-1 max-h-64 overflow-auto"></div>
</div>
</div>

<!-- ================= PRINT APP ================= -->
<div id="printApp" class="hidden card p-4">
<h2 class="font-bold brand-text mb-3">In bảng giá quầy</h2>

<div class="flex gap-2 mb-2">
  <button onclick="startPrintScan()" class="brand-bg text-white px-3 py-2 rounded">Quét barcode</button>
  <button onclick="exportText()" class="bg-slate-700 text-white px-3 py-2 rounded">Xuất TXT</button>
  <button onclick="clearPrintHistory()" class="bg-red-600 text-white px-3 py-2 rounded">Xóa</button>
</div>

<div id="printReader" class="hidden"></div>
<div id="printHistory" class="text-sm"></div>
</div>

<script>
const historyKey="coop_hsd_history";
const printKey="coop_print_history";
let currentFilter="all";
let qr=null,qr2=null;

function toggleMenu(){
  sidebar.classList.toggle("active");
  overlay.classList.toggle("active");
}
function showMain(){mainApp.classList.remove("hidden");printApp.classList.add("hidden");toggleMenu()}
function showPrint(){mainApp.classList.add("hidden");printApp.classList.remove("hidden");toggleMenu()}

function toggleMode(){
  const m=mode.value;
  nsx.disabled=(m==="hsd-only");
  offsetBox.classList.toggle("hidden",m!=="hsd-only");
}

function startScan(){
  reader.classList.remove("hidden");
  reader.innerHTML='<div class="scan-frame"><div class="scan-line"></div></div>';
  if(!qr) qr=new Html5Qrcode("reader");
  qr.start({facingMode:"environment"},{fps:10,qrbox:250},
    code=>{barcode.value=code;qr.stop().then(()=>qr.clear());reader.classList.add("hidden");});
}

function calculate(){
  let nsxVal=nsx.value;
  const hsdVal=hsd.value;

  if(!hsdVal){alert("Nhập HSD");return;}

  if(mode.value==="hsd-only"){
    const off=Number(offsetDays.value);
    if(!off||off<=0){alert("Nhập số ngày NSX trước HSD");return;}
    const d=new Date(hsdVal);
    d.setDate(d.getDate()-off);
    nsxVal=d.toISOString().split("T")[0];
    nsx.value=nsxVal;
  }

  if(!nsxVal){alert("Nhập NSX");return;}

  const nsxD=new Date(nsxVal),hsdD=new Date(hsdVal);
  if(hsdD<=nsxD){alert("HSD phải lớn hơn NSX");return;}

  const total=(hsdD-nsxD)/86400000;
  const d30=new Date(nsxD.getTime()+total*0.7*86400000);
  const d20=new Date(nsxD.getTime()+total*0.8*86400000);
  const today=new Date();

  let f30="Bình thường",f20="Bình thường",b30="",b20="";

  if(today>=d30){f30="Giải tồn";b30="blink30"}
  if(today>=d20){f20="Rút hàng";b20="blink20"}

  result.innerHTML=`
  <div class="border p-3 mb-2 ${b30}">
    <b>Mốc 30%</b><br>${d30.toLocaleDateString("vi-VN")}<br>${f30}
  </div>
  <div class="border p-3 ${b20}">
    <b>Mốc 20%</b><br>${d20.toLocaleDateString("vi-VN")}<br>${f20}
  </div>`;

  saveHistory(f30,f20);
}

function saveHistory(f30,f20){
  let h=JSON.parse(localStorage.getItem(historyKey)||"[]");
  h.unshift({
    Barcode:barcode.value,
    NSX:nsx.value,
    HSD:hsd.value,
    "Cảnh báo 30%":f30,
    "Cảnh báo 20%":f20,
    "Thời gian":new Date().toLocaleString("vi-VN")
  });
  localStorage.setItem(historyKey,JSON.stringify(h));
  renderHistory();
}

function renderHistory(){
  let d=JSON.parse(localStorage.getItem(historyKey)||"[]");
  if(currentFilter==="30") d=d.filter(x=>x["Cảnh báo 30%"]==="Giải tồn");
  if(currentFilter==="20") d=d.filter(x=>x["Cảnh báo 20%"]==="Rút hàng");
  history.innerHTML=d.map(x=>`
    <div class="border-b pb-1">
      <b>${x.Barcode||"-"}</b><br>
      30%: ${x["Cảnh báo 30%"]} | 20%: ${x["Cảnh báo 20%"]}
    </div>`).join("");
  statistic.innerHTML="Tổng: "+d.length;
}

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("f-"+f).classList.add("active");
  renderHistory();
}

function exportExcel(){
  const d=JSON.parse(localStorage.getItem(historyKey)||"[]");
  if(!d.length){alert("Không có dữ liệu");return;}
  const ws=XLSX.utils.json_to_sheet(d);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"HSD");
  XLSX.writeFile(wb,"saigoncoop_hsd.xlsx");
}

function resetForm(){barcode.value="";nsx.value="";hsd.value="";result.innerHTML=""}
function clearHistory(){localStorage.removeItem(historyKey);renderHistory()}
renderHistory();
</script>

</body>
</html>
